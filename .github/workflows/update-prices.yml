name: Update prices

# Runs when prices/updates.json changes on master and sends it to the site's price API.
# Needs the repository secret PRICE_API_TOKEN (same value as the Vercel env var).

on:
  push:
    branches: [master]
    paths: ['prices/updates.json', 'prices/new-products.json']
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: jq -e '.updates | length > 0' prices/updates.json

      - name: Create new products
        if: hashFiles('prices/new-products.json') != ''
        env:
          PRICE_API_TOKEN: ${{ secrets.PRICE_API_TOKEN }}
        run: |
          if [ -z "$PRICE_API_TOKEN" ]; then echo "::error::PRICE_API_TOKEN secret is not set"; exit 1; fi
          code=$(curl -sS -o created.json -w '%{http_code}' -X POST \
            https://www.alfaair.shop/api/admin/prices \
            -H "Authorization: Bearer $PRICE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @prices/new-products.json)
          echo "HTTP $code"
          jq -r '(.created[] | "CREATED\t\(.id)\t\(.name_en)"), (.skipped[] | "EXISTS\t\(.id)\t\(.name_en)"), (.failed[]? | "FAILED\t\(.name_en)\t\(.error)")' created.json
          test "$code" = 200

      - name: Send prices to alfaair.shop
        env:
          PRICE_API_TOKEN: ${{ secrets.PRICE_API_TOKEN }}
        run: |
          if [ -z "$PRICE_API_TOKEN" ]; then echo "::error::PRICE_API_TOKEN secret is not set"; exit 1; fi
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            https://www.alfaair.shop/api/admin/prices \
            -H "Authorization: Bearer $PRICE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @prices/updates.json)
          echo "HTTP $code"
          jq '{updated: (.updated | length), failed}' resp.json
          test "$code" = 200

      - name: Verify prices
        env:
          PRICE_API_TOKEN: ${{ secrets.PRICE_API_TOKEN }}
        run: |
          curl -sS https://www.alfaair.shop/api/admin/prices -H "Authorization: Bearer $PRICE_API_TOKEN" > now.json
          jq -n --slurpfile want prices/updates.json --slurpfile now now.json '
            ($now[0].products | map({(.id): .}) | add) as $by
            | [$want[0].updates[] as $u
               | select(($by[$u.id].price != $u.price)
                   or ($u.price_before != null and $by[$u.id].price_before != $u.price_before)
                   or any(("name_ar","name_en","description_ar","description_en","cold","hot","inverter","images");
                          . as $k | ($u | has($k)) and $by[$u.id][$k] != $u[$k]))
               | $u.id]
          ' > mismatch.json
          cat mismatch.json
          test "$(jq length mismatch.json)" = 0

      - name: Print product catalogue (for review)
        if: always()
        run: |
          test -s now.json || exit 0
          jq -r '.categories[]? | "CATEGORY\t\(.id)\t\(.name_ar)\t\(.name_en)"' now.json
          jq -r '.products[] | [.id, .category_id, .brands.name_en, .power_hp, (if .cold then "C" else "-" end) + (if .hot then "H" else "-" end) + (if .inverter then "I" else "-" end), .price, .price_before, .name_ar, .name_en, ((.images // []) | join(" ")), ((.description_ar // "") | gsub("\\s+"; " ") | .[0:160])] | @tsv' now.json
